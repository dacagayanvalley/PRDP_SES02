name: Build and publish SES-Track 02 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0"

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh SIDLAN API snapshots
        env:
          SIDLAN_FMR_API_KEY: ${{ secrets.SIDLAN_FMR_API_KEY }}
          SIDLAN_IBUILD_API_KEY: ${{ secrets.SIDLAN_IBUILD_API_KEY }}
          SIDLAN_IPLAN_API_KEY: ${{ secrets.SIDLAN_IPLAN_API_KEY }}
          SIDLAN_IREAP_API_KEY: ${{ secrets.SIDLAN_IREAP_API_KEY }}
          SIDLAN_LGU_API_KEY: ${{ secrets.SIDLAN_LGU_API_KEY }}
        run: |
          if [ -n "$SIDLAN_FMR_API_KEY$SIDLAN_IBUILD_API_KEY$SIDLAN_IPLAN_API_KEY$SIDLAN_IREAP_API_KEY$SIDLAN_LGU_API_KEY" ]; then
            python scripts/fetch_sidlan_api_sources.py
          else
            echo "SIDLAN API secrets are not configured; using committed static source snapshot."
          fi

      - name: Build static site
        run: npm run build

      - name: Publish dist to gh-pages branch
        run: |
          cd dist
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add .
          git commit -m "Publish GitHub Pages artifact"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages